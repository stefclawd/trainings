name: kc-mc-lab-sso
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_LOG_LEVEL: INFO
      # Browser nutzt localhost:8080, die Apps sprechen intern mit keycloak:8080
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
    volumes:
      - keycloak-data:/opt/keycloak/data:z # Keycloak h2 database, not for production!
      - ./realm-lab.json:/opt/keycloak/data/import/realm-lab.json
    ports:
      - 127.0.0.1:8080:8080 # HTTP
    networks:
      - backend
    command:
      - "--verbose"
      - "start-dev" # Only for Dev-Environment!
      - "--import-realm"

  acme-timetracking:
    build:
      context: ./acme-app
      # npm ci needs working DNS; "host" avoids broken IPv6-only resolver
      # propagation into the IPv4-only BuildKit build network
      network: host
    environment:
      APP_VARIANT: timetracking
      APP_COLOR: "#1f6feb"
      BASE_URL: http://localhost:8081
      OIDC_ISSUER_INTERNAL: http://keycloak:8080/realms/lab-realm
      CLIENT_ID: acme-timetracking
      CLIENT_SECRET: acme-timetracking-secret
      SESSION_COOKIE_NAME: acme_time_sid
      SESSION_SECRET: timetracking-session-secret
    ports:
      - 127.0.0.1:8081:3000
    networks:
      - backend

  acme-travel:
    build:
      context: ./acme-app
      # npm ci needs working DNS; "host" avoids broken IPv6-only resolver
      # propagation into the IPv4-only BuildKit build network
      network: host
    environment:
      APP_VARIANT: travel
      APP_COLOR: "#2e7d32"
      BASE_URL: http://localhost:8082
      OIDC_ISSUER_INTERNAL: http://keycloak:8080/realms/lab-realm
      CLIENT_ID: acme-travel
      CLIENT_SECRET: "" # TODO: Secret des Clients acme-travel aus Keycloak (Tab Credentials) eintragen
      SESSION_COOKIE_NAME: acme_travel_sid
      SESSION_SECRET: travel-session-secret
    ports:
      - 127.0.0.1:8082:3000
    networks:
      - backend

networks:
  backend:

volumes:
  keycloak-data:
